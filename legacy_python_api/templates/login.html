{% extends "base.html" %}

{% block title %}Giriş Yap - Teknoloji Haberleri{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
    }
    
    .login-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 30px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    
    .login-header {
        background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
        color: white;
        padding: 30px;
        text-align: center;
    }
    
    .login-header h1 {
        margin-bottom: 10px;
        font-size: 1.8em;
    }
    
    .login-header p {
        opacity: 0.8;
        font-size: 0.95em;
    }
    
    .login-body {
        padding: 30px;
    }
    
    .login-form .form-group {
        margin-bottom: 20px;
    }
    
    .login-form .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
    }
    
    .login-form .form-control {
        padding: 12px 15px;
        font-size: 1em;
        border: 2px solid #e0e0e0;
    }
    
    .login-form .form-control:focus {
        border-color: #1976d2;
    }
    
    .remember-me {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 25px;
    }
    
    .remember-me input {
        width: 20px;
        height: 20px;
    }
    
    .remember-me label {
        color: #666;
        cursor: pointer;
    }
    
    .login-btn {
        width: 100%;
        padding: 14px;
        font-size: 1.1em;
        font-weight: 600;
        background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(13, 71, 161, 0.4);
    }
    
    .login-footer {
        text-align: center;
        padding: 20px;
        background-color: #f5f5f5;
        border-top: 1px solid #e0e0e0;
    }
    
    .login-footer a {
        color: #1976d2;
        text-decoration: none;
    }
    
    .login-footer a:hover {
        text-decoration: underline;
    }
    
    .input-icon {
        position: relative;
    }
    
    .input-icon i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
    }
    
    .input-icon .form-control {
        padding-left: 45px;
    }
    
    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .password-wrapper .form-control {
        padding-right: 50px;
    }
    
    .toggle-password {
        position: absolute;
        right: 10px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2em;
        opacity: 0.6;
        transition: opacity 0.2s;
    }
    
    .toggle-password:hover {
        opacity: 1;
    }
    
    .toggle-password.visible {
        opacity: 1;
    }
</style>

<script>
function togglePassword(inputId, button) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        button.textContent = '🙈';
        button.classList.add('visible');
    } else {
        input.type = 'password';
        button.textContent = '👁️';
        button.classList.remove('visible');
    }
}
</script>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>🛡️ Giriş Yap</h1>
            <p>Teknoloji Haberleri Sistemine Hoş Geldiniz</p>
        </div>
        
        <div class="login-body">
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Kullanıcı adınızı girin"
                           required 
                           autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Şifre</label>
                    <div class="password-wrapper">
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-control" 
                               placeholder="Şifrenizi girin"
                               required 
                               autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
                    </div>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember_me" name="remember_me">
                    <label for="remember_me">30 gün boyunca oturumu açık tut</label>
                </div>
                
                <button type="submit" class="login-btn">Giriş Yap</button>
            </form>
        </div>
        
        <div class="login-footer">
            <p>Giriş yapmadan haberleri görüntülemek için <a href="{{ url_for('get_haberler') }}">buraya tıklayın</a></p>
        </div>
    </div>
</div>
{% endblock %}
